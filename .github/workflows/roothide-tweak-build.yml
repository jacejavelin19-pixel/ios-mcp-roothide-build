name: RootHide tweak compile

on:
  push:
    branches: [chore-roothide-toolchain]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      THEOS: ${{ github.workspace }}/.ci-theos
      THEOS_PACKAGE_SCHEME: roothide
    steps:
      - uses: actions/checkout@v6
      - name: Install RootHide Theos and SDK
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          brew install ldid xz
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          "$THEOS/bin/install-sdk" iPhoneOS16.5
          xcodebuild -version
          xcrun --sdk iphoneos clang --version
      - name: Build tweak and preferences
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make FINALPACKAGE=1 DEBUG=0 STRIP=1
          find .theos/obj -name 'ios-mcp.dylib' -print
          test -f .theos/obj/ios-mcp.dylib
          lipo -info .theos/obj/ios-mcp.dylib
          otool -L .theos/obj/ios-mcp.dylib
          mkdir -p ci-output
          cp .theos/obj/ios-mcp.dylib ci-output/
          shasum -a 256 ci-output/ios-mcp.dylib > ci-output/SHA256SUMS
          make -C mcp-memory FINALPACKAGE=1 DEBUG=0 STRIP=1
          cp mcp-memory/.theos/obj/mcp-memory ci-output/
          lipo -info ci-output/mcp-memory
          ldid -e ci-output/mcp-memory > ci-output/mcp-memory-entitlements.plist
          shasum -a 256 ci-output/mcp-memory >> ci-output/SHA256SUMS
      - name: Compile memory manager device test
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk iphoneos clang -arch arm64e -fobjc-arc -miphoneos-version-min=15.0 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -framework Foundation \
            tests/memory_manager_device_test.m MemoryManager.m -o ci-output/memory-manager-device-test
          lipo -info ci-output/memory-manager-device-test
          shasum -a 256 ci-output/memory-manager-device-test >> ci-output/SHA256SUMS
          xcrun --sdk iphoneos clang -arch arm64e -fobjc-arc -miphoneos-version-min=15.0 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -framework Foundation \
            tests/plist_manager_device_test.m PlistPatchManager.m -o ci-output/plist-manager-device-test
          shasum -a 256 ci-output/plist-manager-device-test >> ci-output/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: roothide-tweak-compile-only
          path: ci-output/
          if-no-files-found: error
          retention-days: 7
