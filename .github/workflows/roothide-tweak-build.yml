name: RootHide 1.2.9 package build

on:
  push:
    branches: [chore-roothide-toolchain]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      THEOS: ${{ github.workspace }}/.ci-theos
      THEOS_PACKAGE_SCHEME: roothide
    steps:
      - uses: actions/checkout@v6

      - name: Install RootHide Theos, iOS SDK, and static libzip 1.7.3
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          brew install ldid xz dpkg
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          "$THEOS/bin/install-sdk" iPhoneOS16.5
          xcodebuild -version
          xcrun --sdk iphoneos clang --version

          # Build static iOS arm64+arm64e libzip 1.7.3 for mcp-appinst and mcp-roothelper
          TMP_ZIP="$(mktemp -d)"
          curl -fsSL "https://github.com/nih-at/libzip/releases/download/v1.7.3/libzip-1.7.3.tar.gz" -o "$TMP_ZIP/libzip.tar.gz"
          tar -xzf "$TMP_ZIP/libzip.tar.gz" -C "$TMP_ZIP"
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          cmake -S "$TMP_ZIP/libzip-1.7.3" -B "$TMP_ZIP/build" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;arm64e" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TOOLS=OFF \
            -DBUILD_REGRESS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_DOC=OFF \
            -DENABLE_COMMONCRYPTO=OFF \
            -DENABLE_GNUTLS=OFF \
            -DENABLE_MBEDTLS=OFF \
            -DENABLE_OPENSSL=OFF \
            -DENABLE_WINDOWS_CRYPTO=OFF \
            -DENABLE_BZIP2=OFF \
            -DENABLE_LZMA=OFF \
            -DENABLE_ZSTD=OFF
          cmake --build "$TMP_ZIP/build" --config Release --parallel
          mkdir -p "$THEOS/lib"
          cp "$TMP_ZIP/build/lib/libzip.a" "$THEOS/lib/libzip.a"
          lipo -info "$THEOS/lib/libzip.a"
          rm -rf "$TMP_ZIP"

      - name: Stage SHA256-verified PaddleOCR worker and ONNX models from v1.2.8 release
        shell: bash
        run: |
          set -euo pipefail
          TMP_DEB_DIR="$(mktemp -d)"
          V128_DEB="$TMP_DEB_DIR/com.witchan.ios-mcp_1.2.8_iphoneos-arm64e.deb"
          curl -fsSL "https://github.com/witchann/ios-mcp/releases/download/v1.2.8/com.witchan.ios-mcp_1.2.8_iphoneos-arm64e.deb" -o "$V128_DEB"
          ACTUAL_SHA="$(shasum -a 256 "$V128_DEB" | awk '{print $1}')"
          EXPECTED_SHA="9cce934fe76ab421cb29f14c09be2b44251fda4cbc87c2e3559be9df8a580f33"
          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "SHA256 mismatch on v1.2.8 deb: got $ACTUAL_SHA, expected $EXPECTED_SHA" >&2
            exit 1
          fi
          python3 - "$V128_DEB" <<'PY'
          import hashlib, io, json, os, subprocess, sys, tarfile
          from pathlib import Path

          deb = Path(sys.argv[1])
          members = subprocess.check_output(['ar', 't', str(deb)], text=True).splitlines()
          data_member = next(m.strip() for m in members if m.strip().startswith('data.tar'))
          raw = subprocess.check_output(['ar', 'p', str(deb), data_member])
          with tarfile.open(fileobj=io.BytesIO(raw)) as tf:
              files = {m.name.removeprefix('./'): tf.extractfile(m).read() for m in tf if m.isfile()}

          worker_out = Path('mcp-ocr-worker/.theos/obj/mcp-ocr-worker')
          worker_out.parent.mkdir(parents=True, exist_ok=True)
          worker_out.write_bytes(files['usr/libexec/ios-mcp/mcp-ocr-worker'])
          os.chmod(worker_out, 0o755)

          models_dir = Path('third_party/paddleocr/models')
          expected_hashes = json.loads((models_dir / 'sha256.json').read_text())
          for model_name in ('det.onnx', 'rec.onnx'):
              blob = files[f'usr/share/ios-mcp/paddleocr/{model_name}']
              digest = hashlib.sha256(blob).hexdigest()
              assert digest == expected_hashes[model_name], f'{model_name} hash mismatch: {digest}'
              (models_dir / model_name).write_bytes(blob)
          print('Staged SHA256-verified mcp-ocr-worker, det.onnx, and rec.onnx')
          PY
          rm -rf "$TMP_DEB_DIR"

      - name: Build all helpers, companion payload dylibs, tweak, preferences, and RootHide .deb
        shell: bash
        run: |
          set -euo pipefail
          make clean

          for sub in AppSync AppSync/appinst mcp-roothelper mcp-ldid mcp-memory mcp-keychain mcp-appmod mcp-root mcp-logreader; do
            echo "==> Building subproject: $sub"
            make -C "$sub" THEOS_PACKAGE_SCHEME=roothide clean
            make -C "$sub" THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 DEBUG=0 STRIP=1
          done

          for payload in payloads/sslkillswitch payloads/netcapture payloads/fridastealth; do
            echo "==> Building standalone Apple-SDK payload: $payload"
            env -u THEOS_PACKAGE_SCHEME make -C "$payload" clean
            env -u THEOS_PACKAGE_SCHEME make -C "$payload" FINALPACKAGE=1 DEBUG=0 STRIP=1
          done

          chmod 0755 layout/DEBIAN/postinst
          make FINALPACKAGE=1 DEBUG=0 STRIP=1 THEOS_PACKAGE_SCHEME=roothide package

          ls -la packages/
          BUILT_DEB="$(find packages -maxdepth 1 -type f -name 'com.witchan.ios-mcp_1.2.9*_iphoneos-arm64e.deb' | sort | tail -n 1)"
          test -n "$BUILT_DEB"
          TARGET_DEB="packages/com.witchan.ios-mcp_1.2.9_iphoneos-arm64e.deb"
          if [[ "$BUILT_DEB" != "$TARGET_DEB" ]]; then
            cp "$BUILT_DEB" "$TARGET_DEB"
          fi

          # Normalize numeric tar uid/gid to 0:0 (root:wheel), postinst 0755, and usr/bin/mcp-root setuid 04755
          python3 - "$TARGET_DEB" <<'PY'
          import gzip, io, lzma, sys, tarfile
          from pathlib import Path

          deb_path = Path(sys.argv[1])
          raw = deb_path.read_bytes()
          assert raw[:8] == b'!<arch>\n', 'Not an ar archive'

          members = []
          pos = 8
          while pos < len(raw):
              hdr = raw[pos:pos+60]
              name = hdr[:16].decode('ascii').strip()
              mtime = hdr[16:28]
              size = int(hdr[48:58].decode('ascii').strip())
              body = raw[pos+60:pos+60+size]
              members.append((name, mtime, body))
              pos += 60 + size + (size % 2)

          def normalize_tar(blob: bytes, kind: str) -> bytes:
              src_buf = io.BytesIO(blob)
              with tarfile.open(fileobj=src_buf, mode='r:*') as src_tf:
                  raw_tar_out = io.BytesIO()
                  with tarfile.open(fileobj=raw_tar_out, mode='w', format=tarfile.GNU_FORMAT) as dst_tf:
                      for m in src_tf.getmembers():
                          extracted = src_tf.extractfile(m) if m.isfile() else None
                          m.uid = 0
                          m.gid = 0
                          m.uname = 'root'
                          m.gname = 'wheel'
                          clean_name = m.name.removeprefix('./')
                          if clean_name == 'usr/bin/mcp-root':
                              m.mode = 0o4755
                          elif clean_name in ('postinst', 'prerm', 'preinst', 'postrm'):
                              m.mode = 0o755
                          dst_tf.addfile(m, extracted)
              tar_bytes = raw_tar_out.getvalue()
              if kind.endswith('.gz'):
                  out_c = io.BytesIO()
                  with gzip.GzipFile(filename='', mode='wb', fileobj=out_c, mtime=0) as gz:
                      gz.write(tar_bytes)
                  return out_c.getvalue()
              elif kind.endswith('.lzma'):
                  return lzma.compress(tar_bytes, format=lzma.FORMAT_ALONE)
              elif kind.endswith('.xz'):
                  return lzma.compress(tar_bytes, format=lzma.FORMAT_XZ)
              return tar_bytes

          out_ar = bytearray(b'!<arch>\n')
          for name, mtime, body in members:
              base_name = name.rstrip('/')
              if base_name.startswith('control.tar') or base_name.startswith('data.tar'):
                  body = normalize_tar(body, base_name)
              hdr = (
                  f'{base_name:<16}'
                  + mtime.decode('ascii')
                  + f'{"0":<6}{"0":<6}{"100644":<8}{len(body):<10}`\n'
              ).encode('ascii')
              assert len(hdr) == 60
              out_ar.extend(hdr)
              out_ar.extend(body)
              if len(body) % 2 == 1:
                  out_ar.append(0x0A)

          deb_path.write_bytes(bytes(out_ar))
          print('Normalized', deb_path, 'to 0:0 root:wheel ownership and 04755 mcp-root')
          PY

      - name: Audit RootHide .deb contents, PaddleOCR package test, Mach-O slices, links, and entitlements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output
          DEB="packages/com.witchan.ios-mcp_1.2.9_iphoneos-arm64e.deb"
          cp "$DEB" ci-output/
          python3 tests/paddle_package_test.py --version 1.2.9 --arch arm64e --out ci-output/paddle-package-audit.json

          python3 - "$DEB" ci-output/macho-package-audit.json <<'PY'
          import io, json, os, subprocess, sys, tarfile, tempfile
          from pathlib import Path

          deb = Path(sys.argv[1])
          audit_out = Path(sys.argv[2])

          ctrl_member = next(m.strip() for m in subprocess.check_output(['ar', 't', str(deb)], text=True).splitlines() if m.strip().startswith('control.tar'))
          data_member = next(m.strip() for m in subprocess.check_output(['ar', 't', str(deb)], text=True).splitlines() if m.strip().startswith('data.tar'))

          ctrl_raw = subprocess.check_output(['ar', 'p', str(deb), ctrl_member])
          with tarfile.open(fileobj=io.BytesIO(ctrl_raw)) as ctf:
              ctrl_names = {m.name.removeprefix('./'): m for m in ctf.getmembers()}
              assert 'control' in ctrl_names
              assert 'postinst' in ctrl_names, 'DEBIAN/postinst missing from control.tar!'
              assert (ctrl_names['postinst'].mode & 0o777) == 0o755

          data_raw = subprocess.check_output(['ar', 'p', str(deb), data_member])
          macho_paths = [
              'Library/MobileSubstrate/DynamicLibraries/ios-mcp.dylib',
              'Library/MobileSubstrate/DynamicLibraries/mcp-appsync-installd.dylib',
              'Library/MobileSubstrate/DynamicLibraries/mcp-appsync-frontboard.dylib',
              'Library/PreferenceBundles/iosmcpprefs.bundle/iosmcpprefs',
              'usr/bin/mcp-root',
              'usr/bin/mcp-roothelper',
              'usr/bin/mcp-appinst',
              'usr/bin/mcp-ldid',
              'usr/bin/mcp-logreader',
              'usr/libexec/ios-mcp/mcp-memory',
              'usr/libexec/ios-mcp/mcp-keychain',
              'usr/libexec/ios-mcp/mcp-appmod',
              'usr/libexec/ios-mcp/mcp-ocr-worker',
              'usr/lib/ios-mcp/libmcp_sslks.dylib',
              'usr/lib/ios-mcp/libmcp_netcap.dylib',
              'usr/lib/ios-mcp/libmcp_stealth.dylib',
          ]

          report = {'deb': deb.name, 'size': deb.stat().st_size, 'machos': {}}
          with tarfile.open(fileobj=io.BytesIO(data_raw)) as tf, tempfile.TemporaryDirectory() as tmp:
              members = {m.name.removeprefix('./'): m for m in tf.getmembers()}
              for name, m in members.items():
                  assert m.uid == 0 and m.gid == 0, f'Non-root tar ownership on {name}: {m.uid}:{m.gid}'
              assert (members['usr/bin/mcp-root'].mode & 0o7777) == 0o4755, oct(members['usr/bin/mcp-root'].mode)

              for rel in macho_paths:
                  assert rel in members, f'Missing expected binary in deb: {rel}'
                  blob = tf.extractfile(members[rel]).read()
                  out_f = Path(tmp) / Path(rel).name
                  out_f.write_bytes(blob)
                  archs = subprocess.check_output(['lipo', '-archs', str(out_f)], text=True).strip()
                  links = subprocess.check_output(['otool', '-L', str(out_f)], text=True).strip()
                  ents = subprocess.run(['ldid', '-e', str(out_f)], capture_output=True, text=True).stdout.strip()
                  if rel.startswith('usr/lib/ios-mcp/libmcp_'):
                      assert archs == 'arm64 arm64e' or archs == 'arm64e arm64', f'Payload {rel} must have arm64+arm64e slices, got {archs}'
                      lower_links = links.lower()
                      for forbidden in ('roothide', 'substrate', 'ellekit', 'jbroot'):
                          assert forbidden not in lower_links, f'Payload {rel} links forbidden jailbreak dylib: {links}'
                  report['machos'][rel] = {
                      'mode': oct(members[rel].mode),
                      'size': len(blob),
                      'archs': archs,
                      'otool_L': links,
                      'entitlements': ents,
                  }
                  print(f'[AUDIT OK] {rel}: mode={oct(members[rel].mode)} archs="{archs}"')

          audit_out.write_text(json.dumps(report, indent=2))
          PY

      - name: Build MCPTestTarget.ipa fixture app
        shell: bash
        run: |
          set -euo pipefail
          APP_STAGE="$(mktemp -d)"
          APP_DIR="$APP_STAGE/Payload/MCPTestTarget.app"
          mkdir -p "$APP_DIR"
          cp tests/test_target_app/Info.plist "$APP_DIR/Info.plist"

          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -arch arm64 -arch arm64e \
            -fobjc-arc \
            -miphoneos-version-min=15.0 \
            -isysroot "$IOS_SDK" \
            -Wl,-headerpad_max_install_names \
            -framework UIKit -framework Foundation -framework Security \
            -lsqlite3 \
            tests/test_target_app/main.m \
            -o "$APP_DIR/MCPTestTarget"

          chmod 0755 "$APP_DIR/MCPTestTarget"
          ldid -Stests/test_target_app/entitlements.plist "$APP_DIR/MCPTestTarget"
          lipo -info "$APP_DIR/MCPTestTarget"
          otool -L "$APP_DIR/MCPTestTarget"
          ldid -e "$APP_DIR/MCPTestTarget"

          (cd "$APP_STAGE" && zip -qry "$GITHUB_WORKSPACE/ci-output/MCPTestTarget.ipa" Payload)
          rm -rf "$APP_STAGE"

          (cd ci-output && shasum -a 256 *.deb *.ipa *.json > SHA256SUMS)
          cat ci-output/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: ios-mcp-1.2.9-roothide
          path: ci-output/
          if-no-files-found: error
          retention-days: 7
